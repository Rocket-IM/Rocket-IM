[package]
name = "rocket-browser-storage-probe"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "=0.40.1", default-features = false, features = ["ffi-sqlite-wasm-rs", "hooks"] }
sqlite-wasm-rs = "=0.5.5"
sqlite-wasm-vfs = "=0.2.0"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openmls = { version = "=0.9.0", features = ["js"] }
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
getrandom = { version = "=0.2.17", features = ["js"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
