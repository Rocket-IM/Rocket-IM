[package]
name = "rockets-native-storage-probe"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[features]
protected-storage = ["rusqlite/bundled-sqlcipher", "dep:zeroize"]

[dependencies]
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "hooks", "trace"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
openmls = "=0.9.0"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
sha2 = "=0.10.9"
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
getrandom = "=0.2.17"
zeroize = { version = "=1.9.0", features = ["serde"], optional = true }
