name: rockets_im_stage0
description: Local Stage 0 SDK package verification with precompiled Rust libraries.
version: 0.1.0-stage0.1
publish_to: none
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.11.1
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
