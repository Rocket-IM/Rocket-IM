[package]
name = "rocket-im-sdk"
version = "0.1.0-stage0.1"
edition = "2021"
rust-version = "1.91.0"
publish = false
description = "Rocket-IM阶段0内存设备公共边界，仅用于发布包验证"

[dependencies]
rocket-crypto-core = { version = "=0.1.0-stage0.1", path = "../crypto-core" }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"], optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.151", optional = true }
sha2 = { version = "=0.10.9", optional = true }
zeroize = { version = "=1.9.0", optional = true }
getrandom = { version = "=0.2.17", optional = true }

tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[features]
network = ["persistent", "dep:tungstenite", "dep:rustls", "dep:zeroize", "dep:getrandom"]
persistent = ["rocket-crypto-core/storage", "dep:rusqlite", "dep:serde", "dep:serde_json", "dep:sha2"]

persistent-test-hooks = ["persistent", "rusqlite/hooks"]
protected-storage = ["persistent", "rusqlite/bundled-sqlcipher", "dep:zeroize", "dep:getrandom"]
