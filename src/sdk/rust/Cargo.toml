[workspace]
resolver = "2"
members = [
    "crates/crypto-core",
    "crates/im-sdk",
    "crates/bindings-uniffi",
    "crates/bindings-flutter",
    "crates/bindings-wasm",
]

[workspace.package]
version = "0.1.0-stage0.1"
edition = "2021"
rust-version = "1.91.0"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1

